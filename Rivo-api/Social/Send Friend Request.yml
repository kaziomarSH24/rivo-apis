docs: |-
  # Send Friend Request API

  Sends an explicit connection / friend request directly from a pet's profile.

  ## Figma Screen
  - **Screen:** Others Pet Profile -> "Add Friend" / "Connect" button

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/social/request/send/:petId`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `petId` | integer | Yes | Sender pet ID (e.g. `1` for Pedro) |

  ### Request Body (JSON)
  ```json
  {
    "target_pet_id": 3
  }
  ```

  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `target_pet_id` | integer | Yes | ID of the pet receiving the request |

  ---

  ## Response (200 OK)
  ```json
  {
    "ok": true,
    "message": "Friend request sent successfully",
    "data": {
      "status": "pending",
      "requester_pet_id": 1,
      "connected_pet_id": 3
    }
  }
  ```

