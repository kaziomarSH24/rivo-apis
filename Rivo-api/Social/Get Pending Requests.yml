docs: |-
  # Get Pending Friend Requests API

  Retrieves incoming connection requests waiting for acceptance or rejection.

  ## Figma Screen
  - **Screen:** Matchmaker / Friends Screen -> "Friend Requests" tab or badge counter

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/social/requests/:petId`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `petId` | integer | Yes | Active pet receiving requests (e.g. `1`) |

  ---

  ## Response (200 OK)
  ```json
  {
    "ok": true,
    "message": "Pending requests retrieved successfully",
    "data": [
      {
        "request_id": 5,
        "pet": {
          "id": 6,
          "name": "Rocky",
          "breed": "German Shepherd",
          "photo": null
        },
        "user": {
          "id": 4,
          "name": "Alex Hunter"
        },
        "created_at": "2026-10-19T14:30:00.000000Z"
      }
    ]
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true