info:
  name: Swipe Pet
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/v1/social/swipe/:petId"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: petId
      value: "15"
      type: path
      description: "Active User Pet ID from {{base_url}}/v1/pets"
    - name: target_pet_id
      value: "1"
      type: query
      disabled: true
  body:
    type: multipart-form
    data:
      - name: target_pet_id
        type: text
        value: "1"
        description: "Target Pet ID from {{base_url}}/v1/social/discover/:petId"
      - name: action
        type: text
        value: "liked"
        description: "Swipe action: liked or passed"
  auth:
    type: bearer
    token: "{{pet15User}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
