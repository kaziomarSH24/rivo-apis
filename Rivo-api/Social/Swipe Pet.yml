info:
  name: Swipe Pet
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/v1/social/swipe/1"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "target_pet_id": 3,
        "action": "liked"
      }
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Swipe Pet API (Like or Pass)

  Records a swipe action (`liked` or `passed`) on a discovered pet card.

  ## Figma Screen
  - **Screen:** Discover Screen -> Swipe Right (Heart / Like) or Swipe Left (Cross / Pass)
  - **Match Popup:** If mutual like occurs, triggers "It's a Match!" celebration modal.

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/social/swipe/:petId`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `petId` | integer | Yes | Active pet performing swipe (e.g. `1`) |

  ### Request Body (JSON)
  ```json
  {
    "target_pet_id": 3,
    "action": "liked"
  }
  ```

  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `target_pet_id` | integer | Yes | Pet ID that was swiped on |
  | `action` | string | Yes | Swipe direction: `"liked"` or `"passed"` |

  ---

  ## Response Structure

  ### Match Occurred (200 OK)
  ```json
  {
    "ok": true,
    "message": "It's a match!",
    "data": {
      "is_match": true,
      "connection_id": 12,
      "matched_pet": {
        "id": 3,
        "name": "Luna",
        "breed": "French Bulldog"
      }
    }
  }
  ```

  ### Liked (No Match Yet) / Passed (200 OK)
  ```json
  {
    "ok": true,
    "message": "Swipe recorded successfully",
    "data": {
      "is_match": false
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true