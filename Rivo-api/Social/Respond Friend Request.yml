docs: |-
  # Respond Friend Request API

  Accepts or declines an incoming friend request from another pet.

  ## Figma Screen
  - **Screen:** Pending Requests / Notifications -> "Accept" (Confirm) or "Decline" (Delete)

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/social/request/respond/:petId`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `petId` | integer | Yes | Target pet receiving the request (e.g. `1`) |

  ### Request Body (JSON)
  ```json
  {
    "requester_pet_id": 3,
    "action": "accepted"
  }
  ```

  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `requester_pet_id` | integer | Yes | Pet ID who initiated the friend request |
  | `action` | string | Yes | `"accepted"` or `"declined"` |

  ---

  ## Response (200 OK)
  ```json
  {
    "ok": true,
    "message": "Friend request accepted",
    "data": {
      "status": "accepted",
      "requester_pet_id": 3,
      "connected_pet_id": 1
    }
  }
  ```

