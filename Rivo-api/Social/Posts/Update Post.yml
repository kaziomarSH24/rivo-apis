docs: |-
  # Update Post API (Edit Post)

  Updates an existing post's text content, location, visibility, and audience toggle controls.

  ## Figma Screen
  - **Screen:** Edit Post (accessible from Post 3-dots Menu -> Edit Post)
  - **UI Controls:**
    - Text caption editor
    - Location field
    - Privacy dropdown (Public / Followers / Private)
    - Toggle: "Hide like count on this post"
    - Toggle: "Hide share count on this post"
    - Toggle: "Turn off commenting"

  ---

  ## Request Details
  - **Method:** `PUT` or `PATCH`
  - **URL:** `{{base_url}}/v1/social/posts/:postId`
  - **Authentication:** `Bearer {{userToken}}` (Must be post author)

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `postId` | integer | Yes | ID of the post to update (e.g., `1`) |

  ### Request Headers
  | Header | Value | Description |
  | :--- | :--- | :--- |
  | `Accept` | `application/json` | Expect JSON response |
  | `Content-Type` | `application/json` | Payload format |
  | `Authorization` | `Bearer <token>` | User must be post owner |

  ### Request Body (JSON)
  ```json
  {
    "content": "Updated caption for Pedro's afternoon walk!",
    "location": "Central Dog Park",
    "visibility": "public",
    "hide_like_count": false,
    "hide_share_count": false,
    "turn_off_commenting": false
  }
  ```

  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `content` | string | No | Post caption / text (max 1000 characters) |
  | `location` | string | No | Check-in place or venue name |
  | `visibility` | string | No | `public`, `followers`, or `private` |
  | `hide_like_count` | boolean | No | When `true`, like count is hidden for other users |
  | `hide_share_count` | boolean | No | When `true`, share count is hidden |
  | `turn_off_commenting` | boolean | No | When `true`, comment input is disabled on this post |

  ---

  ## Response Structure
  ```json
  {
    "ok": true,
    "message": "Post updated successfully",
    "data": {
      "id": 1,
      "content": "Updated caption for Pedro's afternoon walk!",
      "location": "Central Dog Park",
      "visibility": "public",
      "hide_like_count": false,
      "hide_share_count": false,
      "turn_off_commenting": false,
      "updated_at": "2026-10-20T10:45:00.000000Z"
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true