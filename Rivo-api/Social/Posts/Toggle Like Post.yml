info:
  name: Toggle Like Post
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/v1/social/posts/:postId/like"
  params:
    - name: postId
      value: "5"
      type: path
      description: Post ID from {{base_url}}/v1/social/posts
  auth:
    type: bearer
    token: "{{pet15User}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
