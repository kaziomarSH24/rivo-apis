info:
  name: React to Post (Bone, Fire, Paw, Heart, Clap)
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/v1/social/posts/:postId/react"
  params:
    - name: postId
      value: "9"
      type: path
      description: "Post ID from {{base_url}}/v1/social/posts"
  body:
    type: json
    data: |-
      {
        "reaction_type": "bone"
      }
  auth:
    type: bearer
    token: "{{pet15User}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Toggles / switches reaction on a post (Facebook model: 1 reaction per user).
  - reaction_type: "bone" (🦴), "fire" (🔥), "paw" (🐾), "heart" (❤️), or "clap" (👏). Default: "bone".
  - If user already reacted with this type, it removes the reaction (unreacts).
  - If user selects a different reaction, it immediately switches to the new reaction.
  - Returns: user_reaction ("bone" or null), is_liked (boolean), likes_count (total), and reactions dictionary.
  - Also accessible via {{base_url}}/v1/social/posts/:postId/like (backward compatible, defaults to bone).


