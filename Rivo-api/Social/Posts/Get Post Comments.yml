info:
  name: Get Post Comments
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/v1/social/posts/:postId/comments"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: postId
      value: "5"
      type: path
      description: "Post ID from {{base_url}}/v1/social/posts"
    - name: include
      value: "user,replies.user"
      type: query
      description: "Relations to include: user,replies,replies.user"
  auth:
    type: bearer
    token: "{{pet15User}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
