info:
  name: Comment Post
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/v1/social/posts/:postId/comments"
  params:
    - name: postId
      value: "5"
      type: path
      description: Post ID from {{base_url}}/v1/social/posts
  body:
    type: multipart-form
    data:
      - name: content
        type: text
        value: Wow, so cute! 🐶
        description: Text content of the comment (Required, max 1000 characters)
      - name: parent_id
        type: text
        value: ""
        description: Optional. Parent comment ID from {{base_url}}/v1/social/posts/:postId/comments for nested replies
        disabled: true
  auth:
    type: bearer
    token: "{{pet15User}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
