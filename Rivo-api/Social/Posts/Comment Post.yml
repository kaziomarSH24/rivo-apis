info:
  name: Comment Post
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/v1/social/posts/:postId/comments"
  params:
    - name: postId
      value: "5"
      type: path
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {
        "content": "Wow, so cute!",
        "parent_id": null
      }
  auth:
    type: bearer
    token: "{{pet15User}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  Adds a comment or reply to a post.

  - To post a top-level comment, set `parent_id` to `null` or omit it.
  - To reply to another comment, set `parent_id` to the ID of that comment.
