info:
  name: Comment Post
  type: http
  seq: 7

http:
  method: POST
  url: "{{base_url}}/v1/social/posts/1/comments"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "content": "Pedro looks so happy! Great walk!"
      }
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Comment on Post API

  Adds a text comment or nested reply to a post.

  ## Figma Screen
  - **Screen:** Post Details Screen -> Comments Section & Comment Input Box

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/social/posts/:postId/comments`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `postId` | integer | Yes | Target post ID |

  ### Request Body (JSON)
  ```json
  {
    "content": "Pedro looks so happy! Great walk!",
    "parent_id": null
  }
  ```

  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `content` | string | Yes | Comment text (max 1000 characters) |
  | `parent_id` | integer\|null | No | ID of parent comment if writing a nested reply |

  ---

  ## Response (201 Created)
  ```json
  {
    "ok": true,
    "message": "Comment created successfully",
    "data": {
      "id": 1,
      "content": "Pedro looks so happy! Great walk!",
      "user": {
        "id": 1,
        "name": "Kazi Omar",
        "avatar": null
      },
      "created_at": "2026-10-20T11:00:00.000000Z"
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
