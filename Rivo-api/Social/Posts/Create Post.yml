info:
  name: Create Post
  type: http
  seq: 2
http:
  method: POST
  url: "{{base_url}}/v1/social/posts"
  auth:
    type: bearer
    token: "{{pet1User}}"
  body:
    type: multipart-form
    data:
      - name: content
        type: text
        value: "This is my first post with a cute dog!"
      - name: type
        type: text
        value: general
      - name: pet_id
        type: text
        value: "1"
        disabled: true
