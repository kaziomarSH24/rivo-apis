info:
  name: Share Walk to Social Feed
  type: http
  seq: 6

http:
  method: POST
  url: "{{base_url}}/v1/social/posts"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: type
        type: text
        value: "walk_summary"
        description: "Set to walk_summary"
      - name: walk_session_id
        type: text
        value: "1"
        description: "Required. Walk Session ID from completed walk"
      - name: content
        type: text
        value: "Completed a 4.2 km trail exploration with Pedro today!"
        description: "Caption / text for the walk post"
      - name: location
        type: text
        value: "Central Dog Park"
        description: "Optional location name"
      - name: visibility
        type: text
        value: "public"
        description: "Post visibility: public, followers, private"
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Share Walk to Social Feed API

  Publishes a completed walk session as an interactive walk summary card on the community feed.

  ## Figma Screen
  - **Screen:** Walk Mode -> Walk Completed Summary -> "Share to Social Feed" button
  - **Screen:** Community Feed / Profile -> Walk summary card (distance, duration, pace, route thumbnail)

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/social/posts`
  - **Authentication:** `Bearer {{userToken}}`

  ### Request Body (multipart/form-data)
  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `type` | string | Yes | Set to `"walk_summary"` |
  | `walk_session_id` | integer | Yes | ID of the completed walk session |
  | `content` | string | No | User's caption or notes |
  | `location` | string | No | Location or park name |
  | `visibility` | string | No | `public`, `followers`, or `private` (default: `public`) |

  ---

  ## Response (201 Created)
  Returns the created `PostResource` with post type `walk_summary` and attached walk metrics.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true