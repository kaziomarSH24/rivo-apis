info:
  name: Get Messages
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/chat/conversations/1/messages?page=1"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Get Messages API

  Fetches paginated chat message history for a specific conversation.

  ## Figma Screen
  - **Screen:** Chat Room / Conversation Screen

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/chat/conversations/:conversationId/messages`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `conversationId` | integer | Yes | ID of the conversation thread |

  ---

  ## Response (200 OK)
  ```json
  {
    "ok": true,
    "message": "Messages retrieved successfully",
    "data": [
      {
        "id": 1,
        "conversation_id": 1,
        "sender_id": 2,
        "body": "Hey, do you want to meet at Central Dog Park?",
        "media_url": null,
        "is_read": true,
        "created_at": "2026-10-20T10:00:00.000000Z"
      }
    ]
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true