info:
  name: Send Message
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/v1/chat/messages"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: conversation_id
        type: text
        value: "1"
        description: "Target conversation ID"
      - name: body
        type: text
        value: "Sounds awesome! We'll be there around 4 PM."
        description: "Message text"
      - name: media
        type: file
        value: []
        description: "Optional photo or audio message attachment"
        disabled: true
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Send Message API

  Sends a text message or media attachment to a conversation. Broadcasts realtime Reverb event.

  ## Figma Screen
  - **Screen:** Chat Room -> Send button / Attachment picker

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/chat/messages`
  - **Authentication:** `Bearer {{userToken}}`

  ### Request Body (multipart/form-data)
  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `conversation_id` | integer | Yes | Target conversation ID |
  | `body` | string | Optional | Text message content (required if no media) |
  | `media` | file | Optional | Image, video, or audio attachment |

  ---

  ## Response (201 Created)
  Returns the created message object with `sender_id`, `created_at`, etc.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true