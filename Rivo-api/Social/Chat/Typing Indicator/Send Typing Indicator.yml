info:
  name: Send Typing Indicator
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/chat/conversations/1/typing"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Send Typing Indicator API

  Broadcasts an ephemeral websocket typing event to other conversation members.

  ## Figma Screen
  - **Screen:** Chat Room (Triggered when user types in message input)

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/chat/conversations/:conversationId/typing`
  - **Authentication:** `Bearer {{userToken}}`

  ---

  ## Response (200 OK)
  Broadcasts event without database write.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true