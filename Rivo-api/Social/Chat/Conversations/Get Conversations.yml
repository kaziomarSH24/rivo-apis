info:
  name: Get Conversations
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/chat/conversations"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{auth_token}}
      disabled: true
  auth:
    type: bearer
    token: "{{pet15User}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Fetches a paginated list of all conversations for the authenticated user, including the last message and unread count.
