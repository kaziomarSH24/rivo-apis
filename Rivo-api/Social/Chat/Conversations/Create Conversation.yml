info:
  name: Create Direct Conversation
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/v1/chat/conversations"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "user_ids": [2]
      }
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Create Conversation API

  Starts or retrieves an existing 1-on-1 direct message conversation with another user.

  ## Figma Screen
  - **Screen:** Match Card -> "Send Message" button
  - **Screen:** Others Pet Profile -> "Message" button

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/chat/conversations`
  - **Authentication:** `Bearer {{userToken}}`

  ### Request Body (JSON)
  ```json
  {
    "user_ids": [2]
  }
  ```

  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `user_ids` | integer[] | Yes | Array with target User ID (e.g. `[2]` for Sarah) |

  ---

  ## Response (200 OK / 201 Created)
  Returns conversation object with `id` and participants list.

settings:
  encodeUrl: true
