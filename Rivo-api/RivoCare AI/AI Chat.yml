info:
  name: AI Chat (Pro Only)
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/ai/chat"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "pet_id": 1,
        "topic": "symptom",
        "prompt": "Pedro has been coughing for 2 days now, especially after running. No other symptoms, eating well.",
        "history": []
      }
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # RivoCare AI Pet Assistant API (Pro Feature)

  Interactive AI veterinary and symptom triage assistant powered by Google Gemini.

  ## Figma Screen
  - **Screen:** RivoCare AI Screen (Floating Bot / Health Advice Chat)

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/ai/chat`
  - **Authentication:** `Bearer {{userToken}}` (Requires active Pro subscription)

  ### Request Body (JSON)
  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `pet_id` | integer | Yes | Pet ID context for medical history |
  | `topic` | string | Yes | `symptom`, `nutrition`, `behavior`, `general` |
  | `prompt` | string | Yes | User question or symptom description |
  | `history` | array | No | Chat history array for multi-turn conversation context |

  ---

  ## Response (200 OK)
  ```json
  {
    "ok": true,
    "message": "Chat response generated successfully",
    "data": {
      "response": "Based on what you described, a dry hacking cough after exercise could indicate kennel cough or airway irritation..."
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true