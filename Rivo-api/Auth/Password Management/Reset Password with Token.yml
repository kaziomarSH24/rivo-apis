info:
  name: Reset Password with Token
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/v1/auth/reset-password-with-token"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: test@example.com
      - name: reset_token
        type: text
        value: "{{reset_token}}"
      - name: password
        type: text
        value: newpassword123
      - name: password_confirmation
        type: text
        value: newpassword123
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Resets the password using the temporary token and a new password.
