info:
  name: Update Password (Logged In)
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/v1/auth/update-password"
  headers:
    - name: Authorization
      value: Bearer {{userToken}}
    - name: Accept
      value: application/json
      disabled: true
  body:
    type: multipart-form
    data:
      - name: current_password
        type: text
        value: "11111111"
      - name: new_password
        type: text
        value: "11111111"
      - name: new_password_confirmation
        type: text
        value: "11111111"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Changes the password for a logged-in user.
