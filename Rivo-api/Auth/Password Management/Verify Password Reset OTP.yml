info:
  name: Verify Password Reset OTP
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/v1/auth/verify-password-otp"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: superadmin@yopmail.com
      - name: otp
        type: text
        value: "592980"
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var jsonData = res.getBody();
        if (jsonData.data.reset_token) {
            bru.setEnvVar("reset_token", jsonData.data.reset_token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Verifies the OTP and returns a temporary 'reset_token'.
