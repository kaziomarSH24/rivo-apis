info:
  name: Forgot Password
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/auth/forgot-password"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: kaziomar@yopmail.com
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Requests a password reset OTP/Link.
