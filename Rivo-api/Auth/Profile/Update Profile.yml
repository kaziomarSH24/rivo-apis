info:
  name: Update Profile
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/v1/profile/update"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{auth_token}}
  body:
    type: multipart-form
    data:
      - name: name
        type: text
        value: Mehedi
        disabled: true
      - name: phone_number
        type: text
        value: "01754563214"
        disabled: true
      - name: company_name
        type: text
        value: Patina Watches
        disabled: true
      - name: avatar
        type: file
        value:
          - C:\Users\kazio\Downloads\snapclip_logo_sample_1789885760854.jpg
        contentType: image/jpeg
      - name: email
        type: text
        value: user@yopmail.com
        disabled: true
  auth:
    type: bearer
    token: "{{userToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Updates the user's profile (name, avatar).
