info:
  name: Get My Profile
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/profile/me"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{auth_token}}
  auth:
    type: bearer
    token: "{{userToken}}"

runtime:
  variables:
    - name: base_url
      value: http://10.10.28.53:80/api

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Gets all information (including roles and permissions) for the logged-in user.
