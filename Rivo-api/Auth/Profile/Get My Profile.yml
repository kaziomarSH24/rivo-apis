info:
  name: Get My Profile
  type: http
  seq: 1

http:
  method: GET
  url: "{{live_url}}/v1/profile/me"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Get Current User Profile API

  Retrieves the authenticated user's account details, contact info, and profile avatar.

  ## Figma Screen
  - **Screen:** Account Settings / User Profile Screen

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/profile/me`
  - **Authentication:** `Bearer {{userToken}}`

  ---

  ## Response (200 OK)
  ```json
  {
    "ok": true,
    "message": "User profile retrieved successfully",
    "data": {
      "id": 1,
      "name": "Kazi Omar",
      "email": "kaziomar@yopmail.com",
      "phone_number": null,
      "avatar": null,
      "latitude": 23.8103,
      "longitude": 90.4125,
      "address": null,
      "created_at": "2026-10-18T00:00:00.000000Z"
    }
  }
  ```
