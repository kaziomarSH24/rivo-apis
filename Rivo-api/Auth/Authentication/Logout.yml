info:
  name: Logout
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/v1/auth/logout"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{userToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Logs out the user and invalidates the current token.
