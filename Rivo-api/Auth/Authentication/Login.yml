info:
  name: Login
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/v1/auth/login"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: "kaziomar@yopmail.com"
        description: "User registered email"
      - name: password
        type: text
        value: "11111111"
        description: "Account password"
      - name: fcm_token
        type: text
        value: "your_device_fcm_token_here"
        description: "Optional Firebase device token for push notifications"
        disabled: true
  auth: inherit

runtime:
  variables:
    - name: base_url
      value: http://10.10.28.53:80/api
  scripts:
    - type: after-response
      code: |-
        try {
            const jsonData = res.getBody();
            if (jsonData && jsonData.data && jsonData.data.access_token) {
                const token = jsonData.data.access_token;
                bru.setVar("userToken", token);
                console.log("Token saved to collection variable 'userToken'");
            }
        } catch (e) {
            console.error("Script error:", e);
        }

docs: |-
  # User Login API

  Authenticates the user with email and password, issuing a Bearer API token.

  ## Figma Screen
  - **Screen:** Login / Sign In Screen

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/auth/login`
  - **Authentication:** None (Public)

  ### Request Body (multipart/form-data or JSON)
  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `email` | string | Yes | Account email address |
  | `password` | string | Yes | Minimum 8 characters |
  | `fcm_token` | string | No | Optional Firebase Cloud Messaging token |

  #### Default Test Credentials:
  - **Main User:** `kaziomar@yopmail.com` / `11111111` (Pets: Pedro, Milo)
  - **Partner User:** `sarah@yopmail.com` / `11111111` (Pet: Luna)

  ---

  ## Response (200 OK)
  ```json
  {
    "ok": true,
    "message": "Login successful",
    "data": {
      "access_token": "1|xyz...",
      "token_type": "Bearer",
      "user": {
        "id": 1,
        "name": "Kazi Omar",
        "email": "kaziomar@yopmail.com",
        "avatar": null
      }
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true