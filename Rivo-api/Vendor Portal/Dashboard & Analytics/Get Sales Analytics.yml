info:
  name: Get Sales Analytics
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/vendor/analytics?period=week"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: period
      value: week
      type: query
      description: "Reporting time range: today, week, month (default: week)"
  auth:
    type: bearer
    token: "{{vendorToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Vendor Sales Analytics & Reports

  Fetches detailed sales statistics, interactive time-series bar chart, fulfillment performance metrics, and top-selling ranked products matching the Figma "Analysis" screen.

  ## Figma Screen
  - **Screen:** Analysis Screen (`Today` / `Week` / `Month` filter pills)
  - **UI Elements:**
    1. **Period Filter:** `Today`, `Week` (active teal), `Month`
    2. **Total Sales Card:** Headline amount (e.g. `$5,440`), percentage growth vs previous period (`+12.4% vs last week`), and 7-day Bar Chart (`Mon` - `Sun` with `is_today` active highlight).
    3. **4 Performance Metric Grid Cards:**
       - `Total Orders` (Box icon, total count, `+X today` subtext badge)
       - `Completed` (Green check icon, total count, `X% rate` subtext badge)
       - `Cancelled` (Red cross icon, total count, `X% rate` subtext badge)
       - `Avg Order Value` (Money bag icon, amount, `+$X vs last wk` subtext badge)
    4. **Best Sellers Card:** Ranked list (`rank`: 1, 2, 3...) with product image, product name, units sold (`X sold`), price, and calculated revenue (`$X`).

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/vendor/analytics`
  - **Authentication:** `Bearer {{vendorToken}}`

  ### Query Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `period` | string | No | `today`, `week`, `month` (default: `week`) |

  ---

