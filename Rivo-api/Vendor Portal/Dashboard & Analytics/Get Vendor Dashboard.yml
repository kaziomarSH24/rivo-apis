info:
  name: Get Vendor Dashboard
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/vendor/dashboard"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{vendorToken}}"

docs: |-
  # Vendor Dashboard Feed

  Fetches the complete vendor operational dashboard matching the **Figma Vendor Homepage / Dashboard Screen**:
  - Time-aware greeting (`Good morning 👋`, `Good afternoon 👋`, `Good evening 👋`)
  - Store profile summary (Name, Logo, Rating, Reviews Count, Live Status toggle, Prep time)
  - Order status badge counters (`all`, `new`, `preparing`, `ready`, `done`, `out_for_delivery`)
  - Today's revenue total + sales growth percentage vs yesterday + 7-day weekly bar chart (`is_today` highlighted)
  - Store Performance cards (Rating, Reviews, Success Rate %, Avg Time)
  - Inventory Alerts list (products with stock <= 5, with `Out of Stock` or `X left` badges)
  - Recent Orders list with customer name, formatted total, relative time (`2 min ago`), and status badges
  - Optimized with Redis multi-tag caching (`vendor_dashboard`, `stores`, `stores:{id}`) with 5-minute rolling TTL and instant invalidation on order/product changes.

  ## Figma Screen
  - **Screen:** Vendor Homepage / Merchant Hub Screen
  - **UI Elements:**
    1. Greeting & Store Header (Logo, Name, ⭐ 4.8 Rating, 312 reviews)
    2. Order Overview pills (1 New, 1 Preparing, 1 Ready, 2 Done)
    3. Today's Sales card ($880, -29.0% vs yesterday, Weekly 7-day Bar Chart)
    4. Store Performance (⭐ 4.8, ✅ 94% Success rate, ⚡ < 5m Avg time)
    5. Inventory Alerts (🔴 Out of Stock, 🟡 3 left, 🟡 5 left)
    6. Recent Orders (ORD-4521, Sarah Mitchell · 2 min ago, $84.50, New)
    7. Quick Actions (Add Product, Manage Orders, Manage Store)

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/vendor/dashboard`
  - **Authentication:** `Bearer {{vendorToken}}`

  ---

  ## Response Structure (200 OK)
  Formatted via `VendorDashboardResource`:
