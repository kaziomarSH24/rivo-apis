info:
  name: Update Store Profile
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/v1/vendor/profile"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{vendorToken}}"
  body:
    type: json
    data: |-
      {
        "name": "Pawsome Pet Shop",
        "phone": "+15125550199",
        "delivery_fee": 0.00,
        "delivery_time_text": "15-20 min",
        "is_live": true
      }

docs: |-
  # Update Store Profile

  Updates store operational details, telephone, base delivery fee, or live status. Can also accept multipart logo/banner uploads.

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/vendor/profile`
  - **Authentication:** `Bearer {{vendorToken}}`

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Business profile updated successfully.",
    "data": { ... }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true