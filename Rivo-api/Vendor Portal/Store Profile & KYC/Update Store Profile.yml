info:
  name: Update Store Profile
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/v1/vendor/profile"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{vendorToken}}"
  body:
    type: multipart
    data:
      - name: name
        value: Pawsome Pet Shop
        type: text
      - name: phone
        value: "+15125550199"
        type: text
      - name: delivery_fee
        value: "0.00"
        type: text
      - name: delivery_time_text
        value: 15-20 min
        type: text
      - name: is_live
        value: "1"
        type: text
      - name: logo
        value: "@file"
        type: file
      - name: banner
        value: "@file"
        type: file

docs: |-
  # Update Store Profile

  Updates merchant operational details, contact info, base delivery fee, live status, or updates logo/cover banner images.
  - Automatically replaces previous image files from disk.
  - Optimizes new images to WebP format.
  - Flushes `['stores', 'stores:{id}']` Redis cache tags.

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/vendor/profile`
  - **Authentication:** `Bearer {{vendorToken}}`
  - **Content-Type:** `multipart/form-data`

  ---

  ## Response Structure (200 OK)
  Formatted via `VendorStoreProfileResource`:
  ```json
  {
    "ok": true,
    "message": "Business profile updated successfully.",
    "data": {
      "id": 1,
      "user_id": 8,
      "name": "Pawsome Pet Shop",
      "slug": "pawsome-pet-shop-w7k82",
      "type": "pet_shop",
      "phone": "+15125550199",
      "logo": "http://localhost/storage/stores/logos/updated_logo.webp",
      "banner": "http://localhost/storage/stores/banners/updated_banner.webp",
      "delivery_fee": 0.0,
      "delivery_time_text": "15-20 min",
      "is_live": true,
      "documents": []
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true