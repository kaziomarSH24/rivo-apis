docs: |-
  # Delete KYC Document

  Removes a previously uploaded business document from the store profile.

  ---

  ## Request Details
  - **Method:** `DELETE`
  - **URL:** `{{base_url}}/v1/vendor/documents/:documentId`
  - **Authentication:** `Bearer {{vendorToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `documentId` | integer | Yes | ID of the document record |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Document removed successfully.",
    "data": []
  }
  ```

