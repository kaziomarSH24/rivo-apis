docs: |-
  # Store Onboarding & KYC Registration

  Allows an authenticated vendor (registered via standard auth with `user_type: "vendor"`) to set up or safely resume/update their merchant store profile and business details.
  - Automatically links store to `$request->user()->id`.
  - Ensures Spatie role `vendor` is attached.
  - Uploads & converts `logo` and `banner` to optimized `.webp` via `FileUploadTrait`.
  - Attaches uploaded KYC documents (`registration_certificate`, `business_license`).
  - Automatically invalidates store Redis cache tags (`['stores', 'stores:{id}']`).
  - Safely handles re-submissions: If store already exists, preserves existing rating, slug, and assets unless newly supplied.

  ## Figma Screen
  - **Screen:** Vendor Onboarding Wizard (Business Details, Location, Operating Type, Photos & KYC)
  - **UI Elements:** Store name, category dropdown (Pet Shop, Veterinary Clinic, Grooming, Pharmacy), street address, operating contact, logo upload, banner upload, legal doc uploads.

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/vendor/store`
  - **Authentication:** `Bearer {{vendorToken}}`
  - **Content-Type:** `multipart/form-data`

  ### Request Form-Data Fields
  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `name` | text | Yes | Commercial business / store name |
  | `type` | text | Yes | `pet_shop`, `veterinary`, `grooming`, `pharmacy` |
  | `owner_name` | text | No | Business owner / manager full name |
  | `phone` | text | No | Store business telephone |
  | `email` | text | No | Official store business email |
  | `street_address` | text | Yes | Physical street address |
  | `city` | text | No | City |
  | `state` | text | No | State (e.g. `TX`) |
  | `zip_code` | text | No | Postal code |
  | `latitude` | text | No | Store GPS Latitude coordinate |
  | `longitude` | text | No | Store GPS Longitude coordinate |
  | `delivery_fee` | text | No | Base delivery charge (default: 0.00) |
  | `delivery_time_text` | text | No | Estimated delivery time badge (default: `15-20 min`) |
  | `logo` | file | No | Square store logo image (auto-converted to WebP) |
  | `banner` | file | No | Store hero cover banner image (auto-converted to WebP) |
  | `registration_certificate` | file | No | PDF / Image registration certificate |
  | `business_license` | file | No | PDF / Image official business license |

  ---

  ## Response Structure (201 Created or 200 OK)
  Formatted via `VendorStoreProfileResource`:
  ```json
  {
    "ok": true,
    "message": "Store profile created successfully.",
    "data": {
      "id": 1,
      "user_id": 8,
      "name": "Pawsome Pet Shop",
      "slug": "pawsome-pet-shop-w7k82",
      "type": "pet_shop",
      "owner_name": "Sarah Mitchell",
      "phone": "+15125550199",
      "email": "sarah.mitchell@yopmail.com",
      "street_address": "2401 S Congress Ave",
      "city": "Austin",
      "state": "TX",
      "zip_code": "78704",
      "latitude": 30.2435,
      "longitude": -97.7521,
      "logo": "http://localhost/storage/stores/logos/1729761234_logo.webp",
      "banner": "http://localhost/storage/stores/banners/1729761234_banner.webp",
      "rating": 5.0,
      "reviews_count": 0,
      "fulfillment_rate": 100.0,
      "avg_prep_time_minutes": 15,
      "delivery_fee": 0.0,
      "delivery_time_text": "15-20 min",
      "is_verified": false,
      "verification_status": "pending",
      "is_live": true,
      "documents": [
        {
          "id": 1,
          "store_id": 1,
          "type": "business_registration_certificate",
          "file_url": "http://localhost/storage/stores/documents/abc.pdf",
          "original_name": "pawsome_registration_certificate.pdf",
          "status": "pending",
          "rejection_reason": null
        }
      ]
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true