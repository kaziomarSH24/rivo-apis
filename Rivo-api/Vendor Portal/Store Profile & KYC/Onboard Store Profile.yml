docs: |-
  # Store Onboarding & KYC Registration

  Allows an authenticated vendor (registered via standard auth with `user_type: "vendor"`) to set up their merchant store profile and business details.
  - Automatically links store to `$request->user()->id`.
  - Ensures Spatie role `vendor` is attached.
  - Generates unique URL slug.

  ## Figma Screen
  - **Screen:** Vendor Onboarding Wizard (Business Details, Location, Operating Type)
  - **UI Elements:** Store name, category dropdown (Pet Shop, Veterinary Clinic, Grooming, Pharmacy), street address, operating contact.

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/vendor/store`
  - **Authentication:** `Bearer {{vendorToken}}`

  ### Request Body Fields
  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `name` | string | Yes | Commercial business / store name |
  | `type` | string | Yes | `pet_shop`, `veterinary`, `grooming`, `pharmacy` |
  | `owner_name` | string | No | Business owner / manager full name |
  | `phone` | string | No | Store business telephone |
  | `email` | string | No | Official store business email |
  | `street_address` | string | Yes | Physical street address |
  | `city` | string | No | City |
  | `state` | string | No | State (e.g. `TX`) |
  | `zip_code` | string | No | Postal code |
  | `latitude` | numeric | No | Store GPS Latitude coordinate |
  | `longitude` | numeric | No | Store GPS Longitude coordinate |
  | `delivery_fee` | numeric | No | Base delivery charge (default: 0.00) |
  | `delivery_time_text` | string | No | Estimated delivery time badge (default: `15-20 min`) |

  ---

  ## Response Structure (201 Created)
  ```json
  {
    "ok": true,
    "message": "Store profile created successfully.",
    "data": {
      "id": 1,
      "user_id": 8,
      "name": "Pawsome Pet Shop",
      "slug": "pawsome-pet-shop-austin",
      "type": "pet_shop",
      "city": "Austin",
      "state": "TX",
      "rating": 5.0,
      "is_verified": false,
      "verification_status": "pending",
      "is_live": true
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true