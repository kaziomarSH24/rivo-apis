info:
  name: Get Store Products Catalog
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/vendor/products"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: status
      value: all
      type: query
      description: "Filter tabs: all, active, draft, out_of_stock (default: all)"
    - name: search
      value: ""
      type: query
      description: "Search keyword matching product name or SKU"
      disabled: true
    - name: per_page
      value: "15"
      type: query
      description: "Items per page"
      disabled: true
    - name: page
      value: "1"
      type: query
      description: "Page number"
      disabled: true
  auth:
    type: bearer
    token: "{{vendorToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Store Products Catalog & Inventory

  Fetches the merchant's catalog formatted to match the Figma **Products** screen layout with tab counters, status filter pills, search bar, and formatted product cards.

  ## Figma Screen
  - **Screen:** Products (Merchant Catalog Screen)
  - **UI Elements:**
    1. **Live Tab Counters (Pills):**
       - `All` (total catalog count)
       - `Active` (live products with positive stock)
       - `Draft` (unpublished / inactive products)
       - `Out of Stock` (zero-inventory products)
    2. **Search Bar:** Real-time search by product title or SKU.
    3. **Product Card Components:**
       - Square thumbnail image URL (WebP formatted)
       - Product Title
       - Subtitle: `Brand · Category` (e.g. `Royal Canin · Cat Food`)
       - Status Badge: `Active` (green), `Draft` (grey), `Out of Stock` (red)
       - Pricing: Active price & strikethrough original price if discounted
       - Stock Label: `45 in stock` / `3 in stock (low stock warning)` / `Out of stock`

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/vendor/products`
  - **Authentication:** `Bearer {{vendorToken}}`

  ### Query Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `status` | string | No | `all`, `active`, `draft`, `out_of_stock` (default: `all`) |
  | `search` | string | No | Search text for name or SKU |
  | `per_page` | integer | No | Items per page (default: 15) |
  | `page` | integer | No | Pagination page number |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Catalog retrieved successfully.",
    "data": {
      "counters": {
        "all": 6,
        "active": 4,
        "draft": 1,
        "out_of_stock": 1
      },
      "current_page": 1,
      "data": [
        {
          "id": 1,
          "name": "Royal Canin Adult Cat Food 4kg",
          "slug": "royal-canin-adult-cat-food-4kg",
          "sku": "RC-CAT-4KG",
          "subtitle": "Royal Canin · Cat Food",
          "image": "https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=800",
          "images": [
            "https://images.unsplash.com/photo-1589924691995-400dc9ecc119?w=800"
          ],
          "price": 28.50,
          "formatted_price": "$28.50",
          "original_price": 35.00,
          "formatted_original_price": "$35.00",
          "stock": 45,
          "stock_status": "in_stock",
          "stock_label": "45 in stock",
          "status": "active",
          "status_label": "Active",
          "status_color": "green",
          "is_active": true,
          "category": { "id": 1, "name": "Cat Food" },
          "brand": { "id": 1, "name": "Royal Canin" }
        }
      ],
      "per_page": 15,
      "total": 6,
      "last_page": 1
    }
  }
  ```
