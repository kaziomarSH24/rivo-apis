docs: |-
  # Soft Delete Product

  Removes a product from the merchant's catalog.

  ---

  ## Request Details
  - **Method:** `DELETE`
  - **URL:** `{{base_url}}/v1/vendor/products/:productId`
  - **Authentication:** `Bearer {{vendorToken}}`

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Product deleted successfully.",
    "data": []
  }
  ```

settings:
