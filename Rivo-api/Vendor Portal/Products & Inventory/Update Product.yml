docs: |-
  # Update Product Details (Vendor Portal)

  Modifies product details, pricing, stock levels, variants, or images.

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/vendor/products/:productId`
  - **Authentication:** `Bearer {{vendorToken}}`
  - *Note:* POST is used instead of PUT/PATCH to natively support PHP binary file uploads when sending `multipart/form-data`.

  ---

  ## Two Ways to Update Images & Variants

  ### Option 1: JSON Body (Default & Bruno)
  - **Header:** `Content-Type: application/json`
  - All fields are optional. Only send the fields you want to modify.
  - To keep or reorder images, pass string URLs in `"images": ["https://..."]`.
  - To sync variants, send the complete new `"variants"` array; the backend will atomically sync them.

  ### Option 2: Multipart Form-Data (File Upload)
  - **Header:** `Content-Type: multipart/form-data`
  - Upload new images using `images[]`. They will be optimized to WebP and saved.
  - Variants can be sent as stringified JSON: `variants: '[{"flavor":"...","price":50,"stock":20}]'`

  ---

  ## Caching & Auto-Invalidation
  Updating a product automatically purges:
  - Merchant catalog cache: `stores:{store_id}:products`
  - Vendor dashboard counters: `stores:{store_id}:dashboard`
  - Vendor analytics: `stores:{store_id}:analytics`
  - Store public cache: `stores:{store_id}`

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Product updated successfully.",
    "data": {
      "id": 1,
      "name": "Royal Canin Medium Adult Dry Dog Food (Updated)",
      "slug": "royal-canin-medium-adult-dry-dog-food",
      "sku": "RC-MED-ADULT",
      "subtitle": "Royal Canin · Food",
      "price": 51.99,
      "formatted_price": "$51.99",
      "original_price": 56.99,
      "formatted_original_price": "$56.99",
      "stock": 50,
      "stock_status": "in_stock",
      "stock_label": "50 in stock",
      "status": "active",
      "status_label": "Active",
      "status_color": "green",
      "is_active": true,
      "variants": [...]
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
