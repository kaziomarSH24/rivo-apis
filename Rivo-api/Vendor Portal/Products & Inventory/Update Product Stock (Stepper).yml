info:
  name: Update Product Stock (Stepper)
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/v1/vendor/products/1/stock"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{vendorToken}}"
  body:
    type: json
    data: |-
      {
        "stock": 50
      }

docs: |-
  # Quick Inventory Stock Stepper

  Allows vendors to instantly adjust product stock levels with a single click from their inventory table.

  ## Figma Screen
  - **Screen:** Merchant Inventory Table
  - **UI Element:** Inline +/- number stepper directly in the table row.

  ---

  ## Request Details
  - **Method:** `PATCH`
  - **URL:** `{{base_url}}/v1/vendor/products/:productId/stock`
  - **Authentication:** `Bearer {{vendorToken}}`

  ### Request Body Fields
  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `stock` | integer | Yes | New inventory count (>= 0) |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Stock updated successfully.",
    "data": {
      "id": 1,
      "name": "Royal Canin Medium Adult Dry Dog Food",
      "stock": 50
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true