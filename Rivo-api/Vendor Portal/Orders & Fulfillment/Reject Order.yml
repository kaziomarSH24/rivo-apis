http:
  method: POST
  url: "{{base_url}}/v1/vendor/orders/1/reject"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{vendorToken}}"
  body:
    type: json
    data: |-
      {
        "reason": "Item out of stock at counter"
      }

docs: |-
  # Reject Store Order

  Cancels the incoming order from the store queue:
  - Updates order status to `cancelled` with `red` status color
  - Re-credits inventory stock for all order items and decrements sales count
  - If payment was captured, automatically initiates gateway refund
  - Purges store order & dashboard caches
  - Returns updated `VendorOrderDetailsResource`

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/vendor/orders/:orderId/reject`
  - **Authentication:** `Bearer {{vendorToken}}`

  ### Request Body
  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `reason` | string | No | Reason for rejecting the order (e.g. out of stock, kitchen closed) |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Order rejected and inventory restored.",
    "data": {
      "id": 1,
      "status": "cancelled",
      "status_label": "Cancelled",
      "status_color": "red",
      "rejection_reason": "Item out of stock at counter"
    }
  }
  ```

settings:
  encodeUrl: true
