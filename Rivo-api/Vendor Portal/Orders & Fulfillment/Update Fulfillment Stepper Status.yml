info:
  name: Update Fulfillment Stepper Status
  type: http
  seq: 5

http:
  method: PATCH
  url: "{{base_url}}/v1/vendor/orders/1/status"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{vendorToken}}"
  body:
    type: json
    data: |-
      {
        "status": "ready_for_pickup"
      }

docs: |-
  # Fulfillment Stepper Status Transition

  Advances order through fulfillment stages matching **Figma Screens 4 & 5**:
  - `preparing` -> Prep in progress
  - `ready_for_pickup` -> Packed and waiting for courier/pickup ("Mark as Ready")
  - `out_for_delivery` -> Courier is en route ("Mark: Out for Delivery")
  - `delivered` -> Successfully handed over to customer ("Mark as Delivered")
  - `cancelled` -> Order cancelled with reason

  ## Figma Screen
  - **Screen:** Order Fulfillment Stepper & Tracking
  - **UI Elements:** Stepper progress buttons: "Mark as Ready", "View Fulfillment", "Mark: Out for Delivery", "Mark Delayed".

  ---

  ## Request Details
  - **Method:** `PATCH`
  - **URL:** `{{base_url}}/v1/vendor/orders/:orderId/status`
  - **Authentication:** `Bearer {{vendorToken}}`

  ### Request Body Fields
  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `status` | string | Yes | `preparing`, `ready_for_pickup`, `out_for_delivery`, `delivered`, `cancelled` |
  | `reason` | string | No | Reason if transitioning to `cancelled` |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Order fulfillment status updated successfully.",
    "data": {
      "id": 1,
      "order_number": "ORD-4520",
      "status": "ready_for_pickup",
      "status_label": "Ready",
      "status_color": "purple",
      "stepper": {
        "current_step": 3,
        "steps": [
          { "key": "new", "label": "New", "step": 1, "is_completed": true, "is_current": false },
          { "key": "prep", "label": "Prep", "step": 2, "is_completed": true, "is_current": false },
          { "key": "ready", "label": "Ready", "step": 3, "is_completed": true, "is_current": true },
          { "key": "done", "label": "Done", "step": 4, "is_completed": false, "is_current": false }
        ]
      },
      "fulfillment_tracking": {
        "badge": "Ready for Pickup",
        "steps": [...]
      },
      "available_actions": [
        "out_for_delivery"
      ]
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
