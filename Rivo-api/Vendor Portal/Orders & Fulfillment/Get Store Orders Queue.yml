        "out_for_delivery": 1,
        "delivered": 2,
        "cancelled": 1
      },
      "current_page": 1,
      "data": [
        {
          "id": 1,
          "order_number": "ORD-4521",
          "status": "new",
          "status_label": "New",
          "status_color": "blue",
