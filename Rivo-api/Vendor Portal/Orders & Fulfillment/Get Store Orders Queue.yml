info:
  name: Get Store Orders Queue
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/vendor/orders"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: filter[status]
      value: preparing
      type: query
      description: "Filter order status: new, preparing, ready_for_pickup, out_for_delivery, delivered, cancelled"
      disabled: true
    - name: sort
      value: -created_at
      type: query
      description: "Sort: -created_at, -total"
      disabled: true
    - name: per_page
      value: "15"
      type: query
      description: "Orders per page"
      disabled: true
  auth:
    type: bearer
    token: "{{vendorToken}}"

docs: |-
  # Store Orders Fulfillment Queue

  Lists incoming and active orders for the merchant's store matching the **Figma Vendor Orders Screen**:
  - Filter tabs: `new`, `preparing`, `ready_for_pickup`, `out_for_delivery`, `delivered`, `cancelled`
  - Eager loads customer contact and ordered items
  - Powered by `BaseService` with Redis caching

  ## Figma Screen
  - **Screen:** Merchant Order Queue / Kitchen & Prep Screen
  - **UI Elements:** Status tabs, Order card with timer badge, Customer name, Items summary list, Accept / Reject buttons.

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/vendor/orders`
  - **Authentication:** `Bearer {{vendorToken}}`

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Store orders retrieved successfully.",
    "data": {
      "current_page": 1,
      "data": [
        {
          "id": 1,
          "order_number": "RIV-78421",
          "status": "preparing",
          "total": 49.11,
          "user": {
            "name": "Omar Faruk",
            "email": "kaziomar@yopmail.com"
          },
          "items": [...]
        }
      ],
      "total": 1
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true