info:
  name: Get Store Orders Queue
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/vendor/orders"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: status
      value: new
      type: query
      description: "Filter tabs: all, new, preparing, ready, out_for_delivery, delivered, cancelled"
      disabled: true
    - name: search
      value: ORD-4521
      type: query
      description: "Search order number or customer name"
      disabled: true
    - name: per_page
      value: "15"
      type: query
      description: "Orders per page"
      disabled: true
  auth:
    type: bearer
    token: "{{vendorToken}}"

docs: |-
  # Store Orders Fulfillment Queue (Vendor Portal)

  Lists incoming and active orders for the merchant's store matching the **Figma Vendor Orders Screen**:
  - Live filter tab pills with dynamic counter badges:
    `New`, `Preparing`, `Ready`, `Out for Delivery`, `Delivered`, `Cancelled`
  - Order Cards with customer initials, delivery address snippet, items summary, and actionable CTA buttons (`Accept`, `Reject`, `Mark as Ready`, `View Fulfillment`).
  - Protected with `EnsureVendorStoreRegistered` (`vendor.store`) middleware and multi-tenant store isolation.
  - Performance optimized with Redis atomic locking and store-isolated tag caching (`stores:{store_id}:orders`).

  ## Figma Screen
  - **Screen:** Merchant Order Queue / Kitchen & Prep Screen
  - **UI Elements:** Tab pills with counts (`New 1`, `Preparing 1`, `Ready 1`, `Out for Delivery 1`), Order card, Action buttons.

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/vendor/orders`
  - **Authentication:** `Bearer {{vendorToken}}`

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Store orders retrieved successfully.",
    "data": {
      "counters": {
        "all": 7,
        "today": 7,
