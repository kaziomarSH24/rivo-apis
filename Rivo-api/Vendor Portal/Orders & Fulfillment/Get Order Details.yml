info:
  name: Get Order Details
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/vendor/orders/1"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{vendorToken}}"

docs: |-
  # Vendor View Order Details

  Fetches detailed order breakdown for merchant fulfillment matching **Figma Screens 2, 4, 5**:
  - **4-Step Order Status Stepper:** `New (1)` -> `Prep (2)` -> `Ready (3)` -> `Done (4)`
  - **Fulfillment Timeline Tracking:** View status milestones (Preparing, Ready for Pickup, Courier Assigned, Out for Delivery, Delivered)
  - **Customer Section:** Name, initials, phone, email, delivery type, and exact delivery address
  - **Order Items List:** Products with images, variants, quantities (`Qty: 2`), unit prices, item totals
  - **Pricing Breakdown:** Subtotal, Delivery Fee, Tax, Discount, Total
  - **Payment & Security:** Payment method, status, notes, rejection reason, allowed actions

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/vendor/orders/:orderId`
  - **Authentication:** `Bearer {{vendorToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `orderId` | integer | Yes | ID of the store order |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Order details retrieved successfully.",
    "data": {
      "id": 1,
      "order_number": "ORD-4521",
      "status": "new",
      "status_label": "New",
      "status_color": "blue",
      "time_ago": "2 minutes ago",
      "stepper": {
        "current_step": 1,
        "steps": [
          { "key": "new", "label": "New", "step": 1, "is_completed": true, "is_current": true },
          { "key": "prep", "label": "Prep", "step": 2, "is_completed": false, "is_current": false },
          { "key": "ready", "label": "Ready", "step": 3, "is_completed": false, "is_current": false },
          { "key": "done", "label": "Done", "step": 4, "is_completed": false, "is_current": false }
        ]
      },
      "fulfillment_tracking": {
        "badge": "Order Received",
        "steps": [...]
      },
      "customer": {
        "id": 14,
        "name": "Sarah Mitchell",
        "initials": "SM",
        "avatar": null,
