info:
  name: Get Notification Stats
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/notifications/stats"
  auth:
    type: bearer
    token: "{{userToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Get the count of unread notifications for the authenticated user.
