info:
  name: Mark One Notification as Read
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/v1/notifications/131637fe-fb24-4a10-b2d6-aa18367d4764/mark-as-read"
  auth:
    type: bearer
    token: "{{userToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Marks a single notification as read. Replace `{{notification_id}}` with an actual notification UUID.
