info:
  name: Get All Notifications
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/notifications"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: per_page
      value: "15"
      type: query
      description: "Items per page"
      disabled: true
    - name: page
      value: "1"
      type: query
      description: "Page number"
      disabled: true
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Get Notifications API

  Fetches the user's in-app activity notifications (likes, comments, friend requests, walk streak milestones, reminders).

  ## Figma Screen
  - **Screen:** Notifications Screen (Bell Icon on App Bar)

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/notifications`
  - **Authentication:** `Bearer {{userToken}}`

  ---

  ## Response (200 OK)
  ```json
  {
    "ok": true,
    "message": "Notifications retrieved successfully",
    "data": [
      {
        "id": "abc-123",
        "type": "post_reaction",
        "title": "New Reaction",
        "body": "Sarah liked Pedro's morning walk post!",
        "read_at": null,
        "created_at": "2026-10-20T10:00:00.000000Z"
      }
    ]
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true