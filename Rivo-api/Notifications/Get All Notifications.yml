info:
  name: Get All Notifications
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/notifications"
  params:
    - name: per_page
      value: "10"
      type: query
      disabled: true
    - name: page
      value: "1"
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{pet15User}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Get a paginated list of all notifications for the authenticated user.
