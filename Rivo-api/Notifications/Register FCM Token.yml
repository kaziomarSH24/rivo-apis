info:
  name: Register FCM Token
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/fcm/register"
  headers:
    - name: Accept
      value: application/json
    - name: Authorization
      value: Bearer {{auth_token}}
  body:
    type: multipart-form
    data:
      - name: token
        type: text
        value: your_mobile_device_fcm_token
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Registers a mobile device's token to receive push notifications.
