info:
  name: Add Note
  type: http
  seq: 4

http:
  method: POST
  url: "{{base_url}}/v1/appointments/1/notes"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"
  body:
    type: multipart-form
    data:
      - name: note
        type: text
        value: Bring vaccination records and insurance card.
