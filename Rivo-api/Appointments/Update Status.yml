info:
  name: Update Status
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{base_url}}/v1/appointments/1/status"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"
  body:
    type: form-urlencoded
    data:
      - name: status
        type: text
        value: completed
