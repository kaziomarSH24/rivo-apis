info:
  name: Mark as Found
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/v1/pets/1/lost-reports/mark-found"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |
  **Mark as Found**
  Toggles Lost Mode OFF for a pet and sets the report status to found.
