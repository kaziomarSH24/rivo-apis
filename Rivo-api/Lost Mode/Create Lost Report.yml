info:
  name: Create Lost Report
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/pets/1/lost-reports"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: last_seen_date
        type: text
        value: "2026-10-20"
        description: "Date pet went missing (YYYY-MM-DD)"
      - name: last_seen_time
        type: text
        value: "16:30"
        description: "Time pet went missing (HH:MM)"
      - name: last_seen_location
        type: text
        value: "Central Dog Park, East Gate"
        description: "Specific location / address"
      - name: additional_info
        type: text
        value: "Wearing a blue collar with tag. Very friendly, responds to Pedro."
        description: "Distinguishing markings, behavior notes"
      - name: reward_amount
        type: text
        value: "200"
        description: "Optional cash reward amount"
      - name: last_seen_photo
        type: file
        value: []
        description: "Optional recent photo file"
        disabled: true
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Create Lost Report API (Activate Lost Mode)

  Activates Emergency Lost Pet Mode for a pet, generates a shareable missing poster, and alerts community pet owners nearby.

  ## Figma Screen
  - **Screen:** Lost Pet Mode Screen -> "Report as Lost" Form

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/pets/:petId/lost-reports`
  - **Authentication:** `Bearer {{userToken}}`

  ### Request Body (multipart/form-data)
  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `last_seen_date` | date | Yes | `YYYY-MM-DD` |
  | `last_seen_time` | string | Yes | `HH:MM` |
  | `last_seen_location` | string | Yes | Location string |
  | `additional_info` | string | No | Collar, tags, microchip, temperament |
  | `reward_amount` | number | No | Reward dollar amount |
  | `last_seen_photo` | file | No | Recent clear photo |

  ---

  ## Response (201 Created)
  Returns the active lost report object with generated poster URL and status `"lost"`.

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true