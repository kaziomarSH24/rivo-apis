info:
  name: Walk Stats (Goals & Streak)
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/v1/pets/1/walk-stats"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
