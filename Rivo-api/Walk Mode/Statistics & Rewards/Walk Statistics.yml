info:
  name: Walk Statistics
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/pets/1/walk-statistics"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: filter[period]
      value: month
      type: query
      disabled: true
  auth:
    type: bearer
    token: "{{userToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
