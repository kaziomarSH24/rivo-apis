info:
  name: Toggle Favorite Route
  type: http
  seq: 9

http:
  method: PUT
  url: "{{base_url}}/v1/walk-routes/1/toggle-favorite"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Toggle Favorite Route API

  Toggles the favorite (bookmark) state on a walking route.

  ## Figma Screen
  - **Screen:** Routes List -> Heart/Star icon button on route card

  ---

  ## Request Details
  - **Method:** `PUT`
  - **URL:** `{{base_url}}/v1/walk-routes/:routeId/toggle-favorite`
  - **Authentication:** `Bearer {{userToken}}`

  ---

  ## Response (200 OK)
  ```json
  {
    "ok": true,
    "message": "Route favorite status updated",
    "data": {
      "route_id": 1,
      "is_favorite": true
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true