http:
  method: POST
  url: "{{base_url}}/v1/walk-routes"
  headers:
    - name: Accept
      value: application/json
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Riverside Scenic Trail",
        "distance_km": 3.2,
        "est_duration_minutes": 28,
        "route_coordinates": [
          {"lat": 23.8103, "lng": 90.4125},
          {"lat": 23.8115, "lng": 90.4130}
        ]
      }
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Create Walk Route API

  Saves a custom walk route with GPS path coordinates.

  ## Figma Screen
  - **Screen:** Walk Mode -> Walk Summary -> "Save as Route" button

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/walk-routes`
  - **Authentication:** `Bearer {{userToken}}`

  ### Request Body (JSON)
  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `name` | string | Yes | Name of the route |
  | `distance_km` | number | Yes | Estimated distance in km |
  | `est_duration_minutes` | integer | No | Estimated walk duration |
  | `route_coordinates` | array | Yes | Array of GPS points: `[{"lat": ..., "lng": ...}]` |

  ---

  ## Response (201 Created)
  Returns the created route resource.

settings:
