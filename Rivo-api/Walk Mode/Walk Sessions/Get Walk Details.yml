info:
  name: Get Walk Details
  type: http
  seq: 9

http:
  method: GET
  url: "{{base_url}}/v1/walks/"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
