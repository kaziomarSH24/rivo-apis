info:
  name: Get Walk Details
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/walks/1"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Get Walk Details API

  Fetches full session telemetry, formatted duration, speed, calories, and GPS route coordinates for map rendering.

  ## Figma Screen
  - **Screen:** Walk History -> Walk Details / Route Map Screen

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/walks/:walkId`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `walkId` | integer | Yes | ID of the walk session (e.g. `1`) |

  ---

  ## Response (200 OK)
  ```json
  {
    "ok": true,
    "message": "Walk session retrieved",
    "data": {
      "id": 1,
      "pet_id": 1,
      "distance_km": 3.2,
      "duration_seconds": 2280,
      "duration_formatted": "00:38:00",
      "steps": 4112,
      "calories": 214,
      "avg_speed_kmh": 5.05,
      "route_coordinates": [
        {"lat": 23.8103, "lng": 90.4125},
        {"lat": 23.8115, "lng": 90.4130}
      ],
      "xp_earned": 64
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true