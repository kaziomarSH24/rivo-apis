info:
  name: List Walks
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/pets/1/walks"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: sort
      value: -created_at
      type: query
      description: "Sort order (-created_at for newest first)"
      disabled: true
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # List Walk Sessions API

  Retrieves chronological history of past walks for a specific pet.

  ## Figma Screen
  - **Screen:** Walk Mode -> Walk History Screen

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/pets/:petId/walks`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `petId` | integer | Yes | Pet ID (e.g. `1` for Pedro) |

  ---

  ## Response (200 OK)
  Returns list of `WalkSessionResource` objects (id, distance_km, duration_formatted, steps, calories, xp_earned, created_at).

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true