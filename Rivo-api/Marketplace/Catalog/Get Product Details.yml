info:
  name: Get Product Details
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/v1/marketplace/products/:product"
  params:
    - name: product
      value: "1"
      type: path
      description: "Product ID (e.g. 1) or slug"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Product Details Screen

  Fetches full product details matching the **Figma Product Details Screen**:
  - Image gallery carousel
  - Price & promotional discount calculation (has_discount, discount_percentage)
  - Flavor selector pills (e.g. Chicken & Rice, Salmon)
  - Size / weight selector pills (e.g. 17 lbs, 30 lbs)
  - In-stock availability badge (is_in_stock, stock)
  - Store info & rating snippet ("By Happy paws ★ 4.9 (128 Reviews)")
  - Category with formatted icon URL
  - Overall star rating & 5-star distribution percentage breakdown (5★ to 1★)

  ## Figma Screens
  - **Screen 1 (Product details):** Image carousel, Favorite heart icon, Brand, Store name, Star rating & review count, Price strike-through, Flavor pills, Size pills, Description with Read More, and sticky bottom Add to Cart bar with quantity counter.
  - **Screen 2 (Product Review):** Product review score, 5-star distribution bars, Write a Review CTA, Sort filter, and review cards with user avatar and time ago.

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/marketplace/products/:product`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `product` | integer / string | Yes | ID or slug of the target product (e.g. `1`) |
