info:
  name: Get Products by Category
  type: http
  seq: 5

http:
  method: GET
  url: "{{base_url}}/v1/marketplace/categories/:categoryId/products?include=store,storeCount,brand,brandCount"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: filter[pet_type]
      value: dog
      type: query
      description: "Filter by pet type: dog, cat, both"
      disabled: true
    - name: filter[brand_id]
      value: "1"
      type: query
      description: Filter by brand ID (e.g. 1 for Royal Canin)
      disabled: true
    - name: sort
      value: -rating
      type: query
      description: "Sort order: -sales_count, -rating, price, -price, created_at"
      disabled: true
    - name: per_page
      value: "15"
      type: query
      description: Number of products per page
      disabled: true
    - name: include
      value: store,storeCount,brand,brandCount
      type: query
      description: "Eager load relations: store, category, brand, variants, reviews | Counts: storeCount, variantsCount, etc."
    - name: categoryId
      value: "1"
      type: path
  auth:
    type: bearer
    token: "{{userToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Get Products by Category

  Returns a paginated list of products within a specific category, supporting dynamic relationships eager-loading (`include`), counts (`*Count`), existence checks (`*Exists`), brand/pet filtering, price sorting, and pagination via `BaseService` and Spatie QueryBuilder.

  ## Figma Screen
  - **Screen:** Category Catalog Screen (e.g., clicking on "Food")
  - **UI Elements:** Category banner, filter chips (Dog, Cat, Brand), price sorting dropdown, and product card grid.

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/marketplace/categories/:categoryId/products`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `categoryId` | integer | Yes | ID of the category (e.g. `1` for Food) |

  ### Query Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `include` | string | No | Dynamic relations, counts, or exists (comma-separated, see below) |
  | `filter[pet_type]` | string | No | Filter products by pet type: `dog`, `cat`, or `both` |
  | `filter[brand_id]` | integer | No | Filter products by specific Brand ID (e.g. `1` for Royal Canin) |
  | `filter[name]` | string | No | Partial name search within this category |
  | `sort` | string | No | Sort order: `price`, `-price`, `-rating`, `-sales_count`, `name`, `created_at` |
  | `per_page` | integer | No | Items per page (default: `15`) |
  | `page` | integer | No | Page number for pagination (e.g. `1`) |

  ---

  ### 🔗 Supported Include Options (`?include=...`)

  | Include Keyword | Category | Result in Response | Description |
  | :--- | :--- | :--- | :--- |
  | `store` | Relation | `"store": { "id": 1, "name": "...", "logo": "..." }` | Eager-loads clean public store details |
  | `brand` | Relation | `"brand": { "id": 1, "name": "...", "logo": "..." }` | Eager-loads brand info & logo |
  | `category` | Relation | `"category": { "id": 1, "name": "...", "icon": "..." }` | Eager-loads category info & icon |
  | `variants` | Relation | `"variants": [ { "id": 1, "flavor": "...", "price": ... } ]` | Eager-loads variant list |
  | `reviews` | Relation | `"reviews": [ ... ]` | Eager-loads recent customer reviews |
  | `storeCount` | Count | `"store_count": 1` | Counts linked stores (returns integer) |
  | `variantsCount` | Count | `"variants_count": 2` | Counts total variants available for the product |
  | `categoryCount` | Count | `"category_count": 1` | Counts linked category |
  | `brandCount` | Count | `"brand_count": 1` | Counts linked brand |
  | `reviewsCount` | Count | `"reviews_count": 84` | Total reviews count |
  | `*Exists` | Exists | `variants_exists`, `store_exists`, etc. | Boolean check (`true` / `false`) |

  > **Example Usage:**  
  > `{{base_url}}/v1/marketplace/categories/1/products?include=store,storeCount,variants,variantsCount`

  ---

  ## Response Structure (200 OK)
  ```json
