info:
  name: Get Store Profile & Products
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/marketplace/stores/1"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Store Profile & Catalog Screen

  Fetches comprehensive details for a specific store:
  - Banner & Logo images
  - Address, city, state, contact phone, email
  - Star rating & 5-star distribution breakdown
  - Catalog of products sold by this merchant

  ## Figma Screen
  - **Screen:** Merchant / Store Profile Page
  - **UI Elements:** Store header banner, verified badge, rating summary, delivery time indicator, and category product carousel.

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/marketplace/stores/:storeId`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `storeId` | integer | Yes | ID of the target store (e.g. `1`) |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Store details retrieved successfully.",
    "data": {
      "store": {
        "id": 1,
        "name": "Pawsome Pet Shop",
        "type": "pet_shop",
        "rating": 4.9,
        "reviews_count": 128,
        "delivery_time_text": "15-20 min",
        "delivery_fee": 0
      },
      "reviews_summary": {
        "average_rating": 4.9,
        "total_reviews": 128,
        "breakdown": {
          "5_star": 90,
          "4_star": 8,
          "3_star": 2,
          "2_star": 0,
          "1_star": 0
        }
      },
      "products": {
        "data": [...]
      }
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true