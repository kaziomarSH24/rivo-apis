info:
  name: Get Store Profile & Products
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/v1/marketplace/stores/1"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: category_id
      value: "1"
      type: query
      description: "Filter products by category ID available in this store (e.g. 1 for Food)"
      disabled: true
    - name: sort
      value: -rating
      type: query
      description: "Sort products: price, -price, rating, -rating, name, created_at, -created_at"
      disabled: true
    - name: per_page
      value: "15"
      type: query
      description: "Number of products per page (default: 15)"
      disabled: true
  auth:
    type: bearer
    token: "{{userToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Store Profile & Catalog Screen

  Fetches comprehensive details for a specific store formatted for the mobile store profile screen.

  ## Figma Screens
  - **Screen 1 (Shop Details):** Store header banner, circular logo badge, store name, rating & review count (`★ 4.9`), delivery fee & time badges, **"Browse Categories"** carousel, **"Products"** grid/carousel with wishlist heart, and **"Review"** preview with customer comment.
  - **Screen 2 (Store Review):** Overall rating score (e.g. `4.8`), total reviews count, 5-star distribution percentage breakdown (5★ to 1★), and paginated customer reviews with timestamps.

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/marketplace/stores/:store`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `store` | integer / string | Yes | ID or slug of the target store (e.g. `1` or `pawsome-pet-shop-austin`) |

  ### Query Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `category_id` | integer | No | Filter products in this store by category ID (e.g. `1` for Food) |
  | `sort` | string | No | Sort products: `price`, `-price`, `rating`, `-rating`, `name` |
  | `per_page` | integer | No | Products per page (default: 15) |

  ---

