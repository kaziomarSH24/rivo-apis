info:
  name: Get Marketplace Home
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/marketplace/home"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Marketplace Home Screen Feed

  Fetches the complete initial consumer marketplace feed matching the **Figma Discovery Screen**.

  ## Figma Screen
  - **Screen:** Marketplace Home / Discovery
  - **UI Elements:**
    - Top Location Header: Active user delivery address with dropdown indicator
    - Rivo Pro Banner: "Unlimited $0 Delivery Fee" with gold badge
    - Category Grid: Food, Treats, Toys, Beds, Grooming, Health, Accessories
    - Popular Stores Near You: SuperPet, Pawsome Pet Shop (15-20 min delivery badge, ratings)
    - **"Products for Pedro"**: Tailored recommendations for user's active pet (breed, size, dietary needs)
    - Top Deals: Products with discount prices

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/marketplace/home`
  - **Authentication:** `Bearer {{userToken}}`

  ### Request Headers
  | Header | Value | Description |
  | :--- | :--- | :--- |
  | `Accept` | `application/json` | Expect JSON response |
  | `Authorization` | `Bearer <token>` | Sanctum token for authenticated pet parent |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Marketplace home feed retrieved successfully.",
    "data": {
      "delivery_address": {
        "id": 1,
        "street_address": "124 Main Street",
        "city": "Austin",
        "is_default": true
      },
      "pro_banner": {
        "title": "Rivo Pro",
        "subtitle": "Unlimited $0 Delivery Fee",
        "badge": "Active Member Benefit"
      },
      "categories": [
        {
          "id": 1,
          "name": "Food",
          "slug": "food",
          "icon": "food.png",
          "products_count": 2
        }
      ],
      "popular_stores": [
        {
          "id": 1,
          "name": "Pawsome Pet Shop",
          "rating": 4.9,
          "reviews_count": 128,
          "delivery_time_text": "15-20 min",
          "is_verified": true
        }
      ],
      "recommended_for_pet": {
        "pet_name": "Pedro",
        "pet_type": "dog",
        "products": [
          {
            "id": 1,
            "name": "Royal Canin Medium Adult Dry Dog Food",
            "price": 54.99,
            "discount_price": 49.99,
            "rating": 4.8
          }
        ]
      },
      "top_deals": []
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true