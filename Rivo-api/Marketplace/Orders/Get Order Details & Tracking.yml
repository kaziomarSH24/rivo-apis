info:
  name: Get Order Details & Tracking
  type: http
  seq: 4

http:
  method: GET
  url: "{{base_url}}/v1/marketplace/orders/1"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # Order Tracking & Receipt Screen

  Fetches complete order tracking information matching the **Figma Order Tracking Screen**:
  - Live fulfillment stepper stage: `new` -> `preparing` -> `ready_for_pickup` -> `out_for_delivery` -> `delivered`
  - Estimated arrival countdown
  - Delivery address details
  - Store details & direct contact
  - Ordered items list
  - Price & payment receipt breakdown

  ## Figma Screen
  - **Screen:** Order Tracking & Details Screen
  - **UI Elements:** 4-step progress stepper (Order Placed, Preparing, On the Way, Delivered), Live courier ETA card, Receipt card.

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/marketplace/orders/:orderId`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `orderId` | integer | Yes | ID of the order |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Order details retrieved successfully.",
    "data": {
      "id": 1,
      "order_number": "RIV-78421",
      "status": "preparing",
      "delivery_type": "express",
      "estimated_delivery_time": "15-20 min",
      "subtotal": 49.99,
      "delivery_fee": 0,
      "tax": 4.12,
      "discount": 5,
      "total": 49.11,
      "payment_method": "mastercard",
      "payment_status": "paid",
      "store": {
        "id": 1,
        "name": "Pawsome Pet Shop",
        "phone": "+15125550199",
        "street_address": "2401 S Congress Ave"
      },
      "items": [...],
      "address": {
        "street_address": "124 Main Street",
        "city": "Austin"
      }
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
