docs: |-
  # Update Cart Item Quantity Stepper

  Adjusts the quantity of a specific cart item directly from the cart screen +/- stepper.

  ---

  ## Request Details
  - **Method:** `PATCH`
  - **URL:** `{{base_url}}/v1/marketplace/cart/items/:itemId`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `itemId` | integer | Yes | ID of the cart item record |

  ### Request Body Fields
  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `quantity` | integer | Yes | New item quantity (minimum: 1) |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Cart item updated.",
    "data": {
      "store": { ... },
      "items": [ ... ],
      "summary": { ... }
    }
  }
  ```

settings:
