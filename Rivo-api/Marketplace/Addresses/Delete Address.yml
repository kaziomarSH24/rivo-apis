docs: |-
  # Delete Saved Address

  Removes an address from the user's saved address book.

  ---

  ## Request Details
  - **Method:** `DELETE`
  - **URL:** `{{base_url}}/v1/marketplace/addresses/:addressId`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `addressId` | integer | Yes | ID of the address to delete |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Delivery address deleted successfully.",
    "data": []
  }
  ```

