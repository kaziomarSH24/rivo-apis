info:
  name: Update Delivery Address
  type: http
  seq: 3

http:
  method: PUT
  url: "{{base_url}}/v1/marketplace/addresses/:addressId"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  params:
    - name: addressId
      value: "1"
      type: path
  body:
    type: json
    data: |-
      {
        "street_address": "124 Main Street",
        "house_no": "Apt 5C (Updated)",
        "city": "New York",
        "is_default": true
      }
  auth:
    type: bearer
    token: "{{userToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: |-
  # Update Existing Address

  Updates address fields for a specific saved address record.

  ---

  ## Request Details
  - **Method:** `PUT`
  - **URL:** `{{base_url}}/v1/marketplace/addresses/:addressId`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `addressId` | integer | Yes | ID of the address record |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Delivery address updated successfully.",
    "data": {
      "id": 1,
      "street_address": "124 Main Street",
      "house_no": "Apt 5C (Updated)",
      "city": "New York",
      "is_default": true,
      "formatted_address": "Apt 5C (Updated), 124 Main Street, New York"
    }
  }
  ```
