docs: |-
  # Update Existing Address

  Updates address fields for a specific saved address record.

  ---

  ## Request Details
  - **Method:** `PUT`
  - **URL:** `{{base_url}}/v1/marketplace/addresses/:addressId`
  - **Authentication:** `Bearer {{userToken}}`

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `addressId` | integer | Yes | ID of the address record |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Delivery address updated successfully.",
    "data": { ... }
  }
  ```

