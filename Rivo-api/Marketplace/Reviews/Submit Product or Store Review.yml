info:
  name: Submit Product or Store Review
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/v1/marketplace/reviews"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"
  body:
    type: json
    data: |-
      {
        "reviewable_type": "product",
        "reviewable_id": 1,
        "order_id": 1,
        "rating": 5,
        "comment": "Pedro absolutely loves this Royal Canin formula! His coat is shinier and he finishes his bowl every time.",
        "is_anonymous": false
      }

docs: |-
  # Submit Product or Store Review

  Submits a customer rating and review for either a purchased product or merchant store.
  - Automatically recalculates model average rating and total reviews count.
  - Links to order ID to verify buyer badge.
  - Supports anonymous review submission toggle.

  ## Figma Screen
  - **Screen:** Write Review Screen / Rate & Review Bottom Sheet
  - **UI Elements:** 5 clickable stars rating selector, review textarea, photo uploader, and "Post Review Anonymously" toggle switch.

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/marketplace/reviews`
  - **Authentication:** `Bearer {{userToken}}`

  ### Request Body Fields
  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `reviewable_type` | string | Yes | Target entity type: `product` or `store` |
  | `reviewable_id` | integer | Yes | Target product ID or store ID |
  | `rating` | integer | Yes | Rating from `1` to `5` |
  | `order_id` | integer | No | Verified purchase order ID |
  | `comment` | string | No | Review text comment (max 1000 characters) |
  | `is_anonymous` | boolean | No | Hide user name in public review list (`true`/`false`) |
  | `photo` | file | No | Optional review attachment image |

  ---

  ## Response Structure (201 Created)
  ```json
  {
    "ok": true,
    "message": "Review submitted successfully.",
    "data": {
      "id": 1,
      "reviewable_type": "product",
      "reviewable_id": 1,
      "rating": 5,
      "comment": "Pedro absolutely loves this Royal Canin formula!",
      "is_anonymous": false,
      "created_at": "2026-10-20T06:41:13.000000Z"
    }
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true