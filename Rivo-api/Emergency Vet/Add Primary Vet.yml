info:
  name: Add Primary Vet
  type: http
  seq: 2

http:
  method: POST
  url: "{{base_url}}/v1/emergency-contacts"
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: type
        type: text
        value: primary
      - name: name
        type: text
        value: Dr. Michael Ahmed
      - name: phone_number
        type: text
        value: +880 1XXX XXX XXX
      - name: notes
        type: text
        value: Available on weekends
  auth:
    type: bearer
    token: "{{userToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
