docs: |-
  # Delete Pet API

  Deletes a pet profile and associated data.

  ## Figma Screen
  - **Screen:** Pet Settings -> "Delete Pet Profile" confirmation modal

  ---

  ## Request Details
  - **Method:** `DELETE`
  - **URL:** `{{base_url}}/v1/pets/:petId`
  - **Authentication:** `Bearer {{userToken}}` (Must be pet owner)

  ### Path Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `petId` | integer | Yes | ID of the pet to delete |

  ---

  ## Response (200 OK)
  ```json
  {
    "ok": true,
    "message": "Pet deleted successfully",
    "data": []
  }
  ```

