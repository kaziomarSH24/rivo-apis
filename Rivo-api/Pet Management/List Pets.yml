info:
  name: List Pets
  type: http
  seq: 1

http:
  method: GET
  url: "{{base_url}}/v1/pets"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: filter[type]
      value: dog
      type: query
      description: "Filter by species: dog, cat"
      disabled: true
    - name: filter[user_id]
      value: "1"
      type: query
      description: "Filter by owner User ID"
      disabled: true
  auth:
    type: bearer
    token: "{{userToken}}"

docs: |-
  # List Pets API

  Lists pets belonging to the authenticated user or all community pets with optional filters.

  ## Figma Screen
  - **Screen:** Home Screen (Pet Selector dropdown / switcher)
  - **Screen:** Community Pet Directory

  ---

  ## Request Details
  - **Method:** `GET`
  - **URL:** `{{base_url}}/v1/pets`
  - **Authentication:** `Bearer {{userToken}}`

  ### Query Parameters
  | Parameter | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `filter[type]` | string | No | Filter by species (`dog`, `cat`) |
  | `filter[user_id]` | integer | No | Filter by owner User ID (e.g. `1` for own pets) |

  ---

  ## Response Structure (200 OK)
  ```json
  {
    "ok": true,
    "message": "Pets retrieved successfully",
    "data": [
      {
        "id": 1,
        "is_owner": true,
        "name": "Pedro",
        "breed": "Golden Retriever",
        "age_years": 3,
        "level": 2,
        "level_title": "Trail Runner",
        "posts_count": 3,
        "friends_count": 2,
        "achievements": {
          "displayed_count": 1,
          "max_slots": 3,
          "slots": [
            { "id": "walk_warrior", "title": "Walk Warrior", "icon": "medal_bronze_paw" },
            null,
            null
          ]
        }
      }
    ]
  }
  ```

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true