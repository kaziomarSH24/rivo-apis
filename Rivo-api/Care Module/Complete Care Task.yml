info:
  name: Complete Care Task
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/v1/pets/:petId/care-tasks/:taskId/complete"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: taskId
      value: "5"
      type: path
    - name: petId
      value: "1"
      type: path
  auth:
    type: bearer
    token: "{{userToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
