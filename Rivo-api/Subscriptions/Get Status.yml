info:
  name: Get Status
  type: http
  seq: 2

http:
  method: GET
  url: "{{base_url}}/v1/subscriptions/status"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{userToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
