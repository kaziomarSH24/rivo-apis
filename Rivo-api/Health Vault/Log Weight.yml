docs: |-
  # Log Weight API

  Records a new weight measurement for the pet to track growth or diet trends.

  ## Figma Screen
  - **Screen:** Health Vault -> Weight Tracker -> "Log Weight" button

  ---

  ## Request Details
  - **Method:** `POST`
  - **URL:** `{{base_url}}/v1/pets/:petId/health-vault/weight`
  - **Authentication:** `Bearer {{userToken}}`

  ### Request Body (JSON)
  | Field | Type | Required | Description |
  | :--- | :--- | :--- | :--- |
  | `weight_kg` | number | Yes | Current weight in kilograms (e.g. `28.5`) |

  ---

  ## Response (201 Created)
  Returns logged weight entry and updates `pets.weight`.

