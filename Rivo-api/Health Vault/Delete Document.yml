docs: |-
  # Delete Medical Document API

  Permanently removes a document and its uploaded file from the pet's Health Vault.

  ---

  ## Request Details
  - **Method:** `DELETE`
  - **URL:** `{{base_url}}/v1/pets/:petId/health-vault/documents/:documentId`
  - **Authentication:** `Bearer {{userToken}}`

  ---

  ## Response (200 OK)
  ```json
  {
    "ok": true,
    "message": "Document deleted successfully",
    "data": []
  }
  ```

